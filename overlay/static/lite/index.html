<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="选一个话题，向知识库提问" />
    <title>知识问答</title>
    <link rel="stylesheet" href="/lite/app.css" />
  </head>
  <body>
    <div id="app">
      <!-- Chat -->
      <section id="view-chat" class="view active">
        <div class="chat-layout">
          <aside class="sidebar" id="sidebar">
            <!-- 项目列表 -->
            <div class="sidebar-section" id="sidebar-projects">
              <div class="section-header">
                <span>知识库</span>
              </div>
              <div id="project-list" class="project-list"></div>
            </div>
            <div class="sidebar-divider"></div>
            <!-- 对话功能区 -->
            <div class="sidebar-section">
              <div class="section-header">
                <button id="btn-search-sidebar" class="sidebar-action">🔍 搜索对话</button>
                <button id="btn-new-chat" class="sidebar-action">＋ 新建</button>
              </div>
            </div>
            <!-- 对话列表 -->
            <ul id="history-list" class="history-list"></ul>
            <!-- 底部：用户信息 -->
            <div class="sidebar-footer">
              <span id="sidebar-user" class="sidebar-user"></span>
              <span id="sidebar-usage" class="sidebar-usage"></span>
              <button type="button" id="btn-logout-sidebar" class="sidebar-logout">登出</button>
              <button type="button" id="btn-theme-sidebar" class="sidebar-logout">🌓</button>
            </div>
          </aside>
          <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

          <button type="button" id="btn-menu-mobile" class="menu-toggle" aria-label="菜单">☰</button>

          <div class="chat-main">
            <main id="messages" class="messages" aria-live="polite"></main>
            <footer class="composer">
              <textarea
                id="input"
                rows="1"
                placeholder="输入你的问题…"
                autocomplete="off"
              ></textarea>
              <button type="button" id="btn-send" class="btn-send" disabled aria-label="发送">↑</button>
            </footer>
          </div>
        </div>
      </section>

      <!-- Search -->
      <section id="view-search" class="view">
        <div class="search-header-layout">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="搜索当前知识库…" autocomplete="off" />
            <button type="button" id="search-btn" class="btn-search-go">🔍</button>
          </div>
          <button type="button" id="btn-back-from-search" class="icon-btn" aria-label="返回聊天">←</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </section>
    </div>

    <div id="banner-offline" class="banner hidden" role="alert"></div>

    <script src="/lite/config.js"></script>
    <script src="/lite/app.js" type="module"></script>
  </body>
</html>
