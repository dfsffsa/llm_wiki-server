<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuChat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/i18n.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 antialiased">
  <div class="flex min-h-screen">
    <!-- 左侧：品牌展示 -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-primary-600 to-primary-800 relative overflow-hidden">
      <!-- 装饰图形 -->
      <div class="absolute inset-0">
        <div class="absolute top-20 left-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
      </div>
      
      <!-- 内容 -->
      <div class="relative z-10 flex flex-col justify-center px-12 lg:px-16">
        <a href="/" class="text-3xl font-bold text-white mb-12" data-i18n="brand.name">DocuChat</a>

        <h1 class="text-4xl font-bold text-white mb-6">
          <span data-i18n="auth.register.welcome1">开始你的</span><br><span data-i18n="auth.register.welcome2">知识之旅</span>
        </h1>
        <p class="text-primary-100 text-lg mb-12" data-i18n="auth.register.subtitle">
          免费注册，立即体验AI知识库的强大功能
        </p>

        <!-- 套餐预览 -->
        <div class="bg-white/10 rounded-2xl p-6 backdrop-blur-sm">
          <h3 class="text-white font-semibold mb-4" data-i18n="auth.register.freeIncludes">免费版包含：</h3>
          <ul class="space-y-3">
            <li class="flex items-center text-primary-100">
              <svg class="w-5 h-5 text-accent-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
              <span data-i18n="auth.register.free.questions">每天3个AI问题</span>
            </li>
            <li class="flex items-center text-primary-100">
              <svg class="w-5 h-5 text-accent-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
              <span data-i18n="auth.register.free.search">全文搜索</span>
            </li>
            <li class="flex items-center text-primary-100">
              <svg class="w-5 h-5 text-accent-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
              <span data-i18n="auth.register.free.graph">知识图谱</span>
            </li>
          </ul>
          <div class="mt-4 pt-4 border-t border-white/20">
            <p class="text-primary-200 text-sm"><span data-i18n="auth.register.moreFeatures">需要更多功能？</span><a href="/pricing" class="text-white hover:underline" data-i18n="auth.register.viewPro">查看专业版</a></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：注册表单 -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 relative">
      <span data-i18n-toggle class="absolute top-6 right-6"></span>
      <div class="w-full max-w-md">
        <!-- 移动端Logo -->
        <div class="lg:hidden mb-8">
          <a href="/" class="text-2xl font-bold text-primary-600" data-i18n="brand.name">DocuChat</a>
        </div>

        <!-- 标题 -->
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-gray-900 mb-2" data-i18n="auth.register.title">创建账号</h2>
          <p class="text-gray-600"><span data-i18n="auth.register.hasAccount">已有账号？</span> <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium" data-i18n="auth.register.loginLink">立即登录</a></p>
        </div>

        <!-- 注册表单 -->
        <form id="register-form" class="space-y-5">
          <!-- 邮箱 -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.register.email">邮箱地址</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
              placeholder="you@example.com"
            >
          </div>

          <!-- 密码 -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.register.password">密码</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              autocomplete="new-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
              placeholder="至少8位字符"
              data-i18n-placeholder="auth.register.passwordPlaceholder"
            >
            <p class="mt-1 text-xs text-gray-500" data-i18n="auth.register.passwordHint">密码至少需要8个字符</p>
          </div>

          <!-- 确认密码 -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.register.confirmPassword">确认密码</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              minlength="8"
              autocomplete="new-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
              placeholder="再次输入密码"
              data-i18n-placeholder="auth.register.confirmPlaceholder"
            >
          </div>

          <!-- 服务条款 -->
          <div class="flex items-start">
            <input
              type="checkbox"
              id="terms"
              required
              class="mt-1 h-4 w-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500"
            >
            <label for="terms" class="ml-2 text-sm text-gray-600" data-i18n-html="auth.register.terms">
              我已阅读并同意 <a href="/terms" class="text-primary-600 hover:underline">服务条款</a> 和 <a href="/privacy" class="text-primary-600 hover:underline">隐私政策</a>
            </label>
          </div>

          <!-- 错误提示 -->
          <div id="error-message" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm" role="alert"></div>

          <!-- 成功提示 -->
          <div id="success-area" class="hidden">
            <div id="success-message" class="bg-green-50 text-green-600 px-4 py-3 rounded-xl text-sm" role="alert"></div>
            <a href="/login" class="mt-4 block text-center text-primary-600 hover:underline text-sm" data-i18n="auth.register.backToLogin">返回登录</a>
          </div>

          <!-- 提交按钮 -->
          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-primary-600 text-white py-3 px-4 rounded-xl font-semibold hover:bg-primary-700 transition-colors shadow-lg shadow-primary-600/30 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span id="btn-text" data-i18n="auth.register.button">创建账号</span>
            <span id="btn-loading" class="hidden" data-i18n="auth.register.buttonLoading">注册中...</span>
          </button>
        </form>

        <!-- 分隔线 -->
        <div class="my-6 flex items-center">
          <div class="flex-1 border-t border-gray-200"></div>
          <span class="px-4 text-sm text-gray-500" data-i18n="auth.register.or">或者</span>
          <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <!-- 社交注册（可选） -->
        <div class="space-y-3">
          <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z"/>
            </svg>
            <span class="text-gray-700 font-medium" data-i18n="auth.register.wechat">使用微信注册</span>
          </button>
        </div>

        <!-- 底部链接 -->
        <div class="mt-8 text-center text-sm text-gray-500">
          <span data-i18n="auth.register.hasAccount">已有账号？</span> <a href="/login" class="text-primary-600 hover:underline" data-i18n="auth.register.loginLink">立即登录</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const termsCheckbox = document.getElementById('terms');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoading = document.getElementById('btn-loading');
    const errorDiv = document.getElementById('error-message');
    const successArea = document.getElementById('success-area');
    const successMessage = document.getElementById('success-message');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // 清除提示
      errorDiv.classList.add('hidden');
      successArea.classList.add('hidden');
      
      // 验证密码匹配
      if (passwordInput.value !== confirmPasswordInput.value) {
        errorDiv.textContent = I18N.t('auth.register.err.passwordMismatch');
        errorDiv.classList.remove('hidden');
        return;
      }

      // 验证服务条款
      if (!termsCheckbox.checked) {
        errorDiv.textContent = I18N.t('auth.register.err.termsRequired');
        errorDiv.classList.remove('hidden');
        return;
      }
      
      // 显示加载状态
      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');
      
      try {
        const response = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          })
        });
        
        const data = await response.json();

        if (!response.ok) {
          const errData = data.error;
          if (errData && typeof errData === 'object') {
            throw new Error(I18N.localizeServerError(errData.code, errData.message) || I18N.t('auth.register.err.generic'));
          }
          throw new Error((typeof errData === 'string' && errData) || I18N.t('auth.register.err.generic'));
        }

        // 注册成功
        successMessage.textContent = I18N.t('auth.register.success');
        successArea.classList.remove('hidden');

        // 3秒后跳转到登录页
        setTimeout(() => {
          window.location.href = '/login';
        }, 3000);
        
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
