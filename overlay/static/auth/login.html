<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - DocuChat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 antialiased">
  <div class="flex min-h-screen">
    <!-- 左侧：品牌展示 -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-primary-600 to-primary-800 relative overflow-hidden">
      <!-- 装饰图形 -->
      <div class="absolute inset-0">
        <div class="absolute top-20 left-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
      </div>
      
      <!-- 内容 -->
      <div class="relative z-10 flex flex-col justify-center px-12 lg:px-16">
        <a href="/" class="text-3xl font-bold text-white mb-12">DocuChat</a>
        
        <h1 class="text-4xl font-bold text-white mb-6">
          欢迎回到<br>DocuChat
        </h1>
        <p class="text-primary-100 text-lg mb-12">
          登录后开始你的AI知识库之旅
        </p>
        
        <!-- 特性列表 -->
        <div class="space-y-6">
          <div class="flex items-center">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mr-4">
              <span class="text-2xl">🤖</span>
            </div>
            <div>
              <h3 class="text-white font-semibold">AI智能问答</h3>
              <p class="text-primary-200 text-sm">自然语言提问，精准回答</p>
            </div>
          </div>
          
          <div class="flex items-center">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mr-4">
              <span class="text-2xl">🔍</span>
            </div>
            <div>
              <h3 class="text-white font-semibold">全文搜索</h3>
              <p class="text-primary-200 text-sm">毫秒级检索，快速定位</p>
            </div>
          </div>
          
          <div class="flex items-center">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mr-4">
              <span class="text-2xl">🕸️</span>
            </div>
            <div>
              <h3 class="text-white font-semibold">知识图谱</h3>
              <p class="text-primary-200 text-sm">可视化关联，发现新知</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 右侧：登录表单 -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
      <div class="w-full max-w-md">
        <!-- 移动端Logo -->
        <div class="lg:hidden mb-8">
          <a href="/" class="text-2xl font-bold text-primary-600">DocuChat</a>
        </div>
        
        <!-- 标题 -->
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">登录账号</h2>
          <p class="text-gray-600">还没有账号？ <a href="/register" class="text-primary-600 hover:text-primary-700 font-medium">免费注册</a></p>
        </div>

        <!-- verified=true 提示 -->
        <div id="verified-banner" class="hidden bg-green-50 text-green-700 px-4 py-3 rounded-xl text-sm mb-4" role="alert">
          ✅ 邮箱已验证，请登录
        </div>
        <!-- verified=failed 提示 -->
        <div id="verify-failed-banner" class="hidden bg-yellow-50 text-yellow-700 px-4 py-3 rounded-xl text-sm mb-4" role="alert">
          ⚠️ 验证链接无效或已过期，请重新注册或联系管理员
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="space-y-5">
          <!-- 邮箱 -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">邮箱地址</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              autocomplete="email"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
              placeholder="you@example.com"
            >
          </div>
          
          <!-- 密码 -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              minlength="8"
              autocomplete="current-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
              placeholder="••••••••"
            >
          </div>
          
          <!-- 忘记密码 -->
          <div class="flex items-center justify-end">
            <a href="/reset-password" class="text-sm text-primary-600 hover:text-primary-700">忘记密码？</a>
          </div>
          
          <!-- 错误提示 -->
          <div id="error-message" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm" role="alert"></div>
          
          <!-- 提交按钮 -->
          <button 
            type="submit" 
            id="submit-btn"
            class="w-full bg-primary-600 text-white py-3 px-4 rounded-xl font-semibold hover:bg-primary-700 transition-colors shadow-lg shadow-primary-600/30 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span id="btn-text">登录</span>
            <span id="btn-loading" class="hidden">登录中...</span>
          </button>
        </form>
        
        <!-- 分隔线 -->
        <div class="my-6 flex items-center">
          <div class="flex-1 border-t border-gray-200"></div>
          <span class="px-4 text-sm text-gray-500">或者</span>
          <div class="flex-1 border-t border-gray-200"></div>
        </div>
        
        <!-- 社交登录（可选） -->
        <div class="space-y-3">
          <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z"/>
            </svg>
            <span class="text-gray-700 font-medium">使用微信登录</span>
          </button>
        </div>
        
        <!-- 底部链接 -->
        <div class="mt-8 text-center text-sm text-gray-500">
          登录即表示你同意我们的 <a href="/terms" class="text-primary-600 hover:underline">服务条款</a> 和 <a href="/privacy" class="text-primary-600 hover:underline">隐私政策</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoading = document.getElementById('btn-loading');
    const errorDiv = document.getElementById('error-message');

    // 页面加载时检查 query param
    const params = new URLSearchParams(window.location.search);
    if (params.get('verified') === 'true') {
      document.getElementById('verified-banner').classList.remove('hidden');
    } else if (params.get('verified') === 'failed') {
      document.getElementById('verify-failed-banner').classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // 清除错误
      errorDiv.classList.add('hidden');
      
      // 显示加载状态
      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');
      
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          const errData = data.error || {};
          if (errData.code === 'email_not_verified') {
            errorDiv.innerHTML = '邮箱未验证，请先查收验证邮件。没收到？<a href="/register" class="underline">重新注册</a>';
            errorDiv.classList.remove('hidden');
          } else {
            throw new Error(errData.message || '登录失败');
          }
        }
        
        // 登录成功，跳转到问答页
        window.location.href = '/lite/';
        
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
